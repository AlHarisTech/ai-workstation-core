name: Race Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test -race -count=1 -timeout 120s $(go list ./runtime/... | grep -v compliance)
